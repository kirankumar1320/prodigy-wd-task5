<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌤️ Weather Checker by Kiran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Welcome to Your Personal Weather Guide ☁️</h1>

  <div class="search-box">
    <input type="text" id="locationInput" placeholder="Type a city name you love...">
    <button onclick="getWeather()">Show Me the Weather</button>
  </div>

  <div class="weather-info" id="weatherInfo">
    <p class="friendly-note">Let’s find out what the sky’s up to today 🌈</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
